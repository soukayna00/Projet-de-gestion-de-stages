name: Docker Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for CI
        working-directory: ./backend
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          cat >> .env << 'ENVEOF'
          APP_NAME=Laravel
          APP_ENV=local
          APP_KEY=base64:dummykeyforCIonly1234567890abcde=
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=pgsql
          DB_HOST=db
          DB_PORT=5432
          DB_DATABASE=Projet-de-gestion-de-stages
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          ENVEOF

      - name: Build backend and db only (skip frontend)
        run: docker compose build app

      - name: Start backend + db
        run: docker compose up -d db app webserver

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for postgres..."
          for i in {1..15}; do
            docker compose exec -T db pg_isready -U postgres && break
            sleep 3
          done

      - name: Check containers are running
        run: |
          docker compose ps
          docker compose ps | grep -E "laravel_app|nginx_server|postgres_db" | grep "Up" | wc -l

      - name: Tear down
        if: always()
        run: docker compose down -v
