name: Docker Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for CI
        working-directory: ./backend
        run: |
          cp .env.example .env
          sed -i 's/APP_KEY=.*/APP_KEY=base64:dummykeyforCIonly1234567890abcdef12=' .env
          sed -i 's/DB_HOST=.*/DB_HOST=db/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=Projet-de-gestion-de-stages/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env

      - name: Build all containers
        run: docker compose build --no-cache

      - name: Start containers
        run: docker compose up -d

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for postgres..."
          for i in {1..15}; do
            docker compose exec -T db pg_isready -U postgres && break
            sleep 3
          done

      - name: Check all containers are running
        run: |
          docker compose ps
          docker compose ps | grep -v "Exit" | grep -c "Up" || (echo "Some containers failed" && exit 1)

      - name: Tear down
        if: always()
        run: docker compose down -v
